<table>
  <thead>
    <tr>
      <th></th>
      <th>Producto</th>
      <th>Cant.</th>
      <th>Precio</th>
      <th>Total c/desc.</th>
    </tr>
  </thead>
  <tbody>
    @for (p of products(); track p.id) {
      <tr>
        <td><img [src]="p.thumbnail" [alt]="p.title" width="40" height="40" /></td>
        <td>{{ p.title }}</td>
        <td>{{ p.quantity }}</td>
        <td>{{ p.price | currency }}</td>
        <td>{{ p.discountedTotal | currency }}</td>
      </tr>
    }
  </tbody>
</table>
