<article
  class="grid h-full grid-rows-[auto_auto_1fr_auto] gap-3 rounded-xl border border-blue-100 bg-white p-5 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md hover:shadow-blue-600/10"
>
  <header class="grid grid-cols-[1fr_auto] items-center gap-2">
    <h3 class="truncate text-base font-semibold text-blue-950">Pedido #{{ order().id }}</h3>
    <span class="rounded-full bg-blue-50 px-2.5 py-0.5 text-xs font-medium text-blue-700">
      Usuario {{ order().userId }}
    </span>
  </header>

  <p class="text-sm text-blue-500">
    {{ order().totalProducts }} productos · {{ order().totalQuantity }} unidades
  </p>

  <p class="grid grid-cols-[auto_auto_1fr] items-baseline content-start gap-2">
    <s class="text-sm text-blue-300">{{ order().total | currency }}</s>
    <strong class="text-xl font-bold text-blue-700">{{ order().discountedTotal | currency }}</strong>
    <small class="justify-self-start rounded-md bg-blue-600 px-1.5 py-0.5 text-xs font-semibold text-white">
      -{{ order().total | discountPercent: order().discountedTotal }}
    </small>
  </p>

  <button
    type="button"
    (click)="viewDetail.emit(order().id)"
    class="rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 active:scale-[0.98]"
  >
    Ver detalle
  </button>
</article>
