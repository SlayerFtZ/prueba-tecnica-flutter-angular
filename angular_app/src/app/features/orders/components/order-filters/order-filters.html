<form
  [formGroup]="form"
  class="grid grid-cols-1 items-end gap-4 rounded-xl border border-blue-100 bg-white p-5 shadow-sm sm:grid-cols-2 lg:grid-cols-[1fr_1fr_auto]"
>
  <label class="grid gap-1.5 text-sm font-medium text-blue-900">
    Total mínimo
    <input
      type="number"
      min="0"
      formControlName="minTotal"
      placeholder="0"
      class="w-full rounded-lg border border-blue-200 bg-blue-50/50 px-3 py-2 text-sm text-blue-950 placeholder:text-blue-300 transition focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-200"
    />
  </label>

  <label class="grid gap-1.5 text-sm font-medium text-blue-900">
    Usuario (ID)
    <input
      type="number"
      min="1"
      formControlName="userId"
      placeholder="Ej. 12"
      class="w-full rounded-lg border border-blue-200 bg-blue-50/50 px-3 py-2 text-sm text-blue-950 placeholder:text-blue-300 transition focus:border-blue-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-200"
    />
  </label>

  <button
    type="button"
    (click)="clear()"
    class="rounded-lg border border-blue-200 bg-white px-4 py-2 text-sm font-medium text-blue-700 transition hover:bg-blue-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 active:scale-[0.98] sm:col-span-2 lg:col-span-1"
  >
    Limpiar
  </button>
</form>
