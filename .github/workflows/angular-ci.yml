name: Angular CI

on:
  push:
    paths:
      - 'angular_app/**'
      - '.github/workflows/angular-ci.yml'

  pull_request:
    paths:
      - 'angular_app/**'
      - '.github/workflows/angular-ci.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angular_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular_app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create .env for CI
        run: cp .env.template .env

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build